[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-s3-ai-agent-desktop"
version = "0.1.0"
description = "ESP32-S3 AI Agent desktop management client"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "pyserial>=3.5,<4",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
esp32-s3-ai-agent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
